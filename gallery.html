<!DOCTYPE html>
<html>
<head>
    <title>Gallery</title>

    <style>
    .gallery {
        display:grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 10px;
        padding:10px;
    }

    .gallery img{
       width:100%;
       height: 200px;
       object-fit: cover;
       border-radius: 20px;
    }
    </style>

</head>
<body>

<div class="gallery">
    <img src="https://via.placeholder.com/300">
    <img src="https://via.placeholder.com/300">
    <img src="https://via.placeholder.com/300">
    <img src="https://via.placeholder.com/300">
</div>

</body>
</html>
