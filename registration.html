<!DOCTYPE html>
<html>
<head>
<title>Register</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: #f2f2f2;
}

.form-container {
    background: white;
    padding: 20px;
    border-radius: 10px;
    width: 300px;
    display: flex;
    flex-direction: column;
}

input {
    margin: 10px 0;
    padding: 10px;
    border: 1px solid gray;
}

input:focus {
    border: 2px solid blue;
    outline: none;
}

button {
    padding: 10px;
    background: blue;
    color: white;
    border: none;
}

button:hover {
    background: black;
}

/* Responsive */
@media(max-width:600px) {
    .form-container {
        width: 100%;
    }
}
</style>

</head>
<body>

<div class="form-container">
    <h2 id="title">Register</h2>
    <input type="text" placeholder="Name">
    <input type="email" placeholder="Email">
    <input type="password" placeholder="Password">
    <input type="password" placeholder="Confirm Password">
    <button>Submit</button>
</div>

</body>
</html>
