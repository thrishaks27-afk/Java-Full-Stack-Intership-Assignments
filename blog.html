<!DOCTYPE html>
<html>
<head>
<style>
.container {
    display: grid;
    grid-template-columns: 200px 1fr;
    gap: 10px;
}

.sidebar {
    background: lightgray;
    padding: 10px;
}

.post {
    border: 1px solid #ccc;
    padding: 10px;
}

.post:hover {
    background: #f2f2f2;
}

@media(max-width:600px){
    .container {
        grid-template-columns: 1fr;
    }
}
</style>
</head>
<body>

<div class="container">

<div class="sidebar">
    <h3>Categories</h3>
</div>

<div>
    <div class="post">
        <h2>Blog Title</h2>
        <p>Description</p>
    </div>

    <div class="post">
        <h2>Blog Title</h2>
        <p>Description</p>
    </div>
</div>

</div>

</body>
</html>
