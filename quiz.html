<!DOCTYPE html>
<html>
<head>
    <title>Quiz App</title>

    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            width: 350px;
            box-shadow: 0 0 10px gray;
        }

        h2 {
            text-align: center;
        }

        p {
            font-weight: bold;
        }

        button {
            width: 100%;
            padding: 10px;
            background: blue;
            color: white;
            border: none;
            margin-top: 10px;
            cursor: pointer;
        }

        button:hover {
            background: black;
        }

        #result {
            text-align: center;
            margin-top: 10px;
        }
    </style>

</head>
<body>

<div class="container">
    <h2>Quiz App</h2>

    <div id="quiz"></div>

    <button onclick="submitQuiz()">Submit</button>

    <h3 id="result"></h3>
</div>

<script>
// 👉 Questions (Backend Simulation)
let questions = [
    {
        question: "Capital of India?",
        options: ["Delhi", "Mumbai", "Chennai"],
        answer: "Delhi"
    },
    {
        question: "5 + 3 = ?",
        options: ["6", "8", "10"],
        answer: "8"
    },
    {
        question: "HTML stands for?",
        options: ["Hyper Text Markup Language", "High Text Machine Language", "Home Tool Markup Language"],
        answer: "Hyper Text Markup Language"
    }
];

// 👉 Display Questions
let quizDiv = document.getElementById("quiz");

questions.forEach((q, index) => {
    let html = `<p>${q.question}</p>`;

    q.options.forEach(option => {
        html += `
        <input type="radio" name="q${index}" value="${option}"> ${option} <br>
        `;
    });

    quizDiv.innerHTML += html;
});

// 👉 Calculate Score
function submitQuiz() {
    let score = 0;

    questions.forEach((q, index) => {
        let selected = document.querySelector(`input[name="q${index}"]:checked`);

        if (selected && selected.value === q.answer) {
            score++;
        }
    });

    document.getElementById("result").innerText =
        "Your Score: " + score + " / " + questions.length;
}
</script>

</body>
</html>
