<!DOCTYPE html>
<html>
<head>
<style>
    .box {
        width: 300px;
        height: 150px;
        background-color: lightblue;

        margin: 0 auto;          /* centers box horizontally */
        text-align: center;      /* centers text inside */
        line-height: 150px;      /* vertical center text (simple trick) */
    }
</style>
</head>

<body>

<div class="box">
    Hello Trisha 👋
</div>

</body>
</html>
